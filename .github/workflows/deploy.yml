name: Deploy admin (static) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "CNAME"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The admin console is a self-contained static site under web/.
      # No build step, no service-role secret — the client uses only the public
      # anon key (RLS + admin-only RPCs enforce access).
      - name: Assemble site
        run: |
          cp CNAME web/CNAME
          touch web/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
